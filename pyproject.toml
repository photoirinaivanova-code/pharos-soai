[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos-soai"
version = "0.1.0"
description = "Read-only Pharos Atlantic Testnet onchain data and Transfer event monitor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
pharos-soai = "pharos_soai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
